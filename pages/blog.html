<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO: Dynamic title set by JS, generic fallback here -->
    <title>Blog | Antony Bush - Backend Software Engineer</title>

    <!-- SEO Meta Tags (generic fallback — JS updates dynamically) -->
    <meta name="description"
        content="Technical blog posts by Antony Bush covering systems programming, networking, backend architecture, and productivity tools. Visual explanations and deep dives.">
    <meta name="keywords"
        content="antony bush, blog, software engineering, backend development, systems programming, networking, distributed systems">
    <meta name="author" content="Antony Bush">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Social Media (generic fallback — JS updates dynamically) -->
    <meta property="og:type" content="article">
    <meta property="og:title" content="Blog | Antony Bush">
    <meta property="og:description"
        content="Technical blog posts covering systems programming, networking, backend architecture, and productivity tools.">
    <meta property="og:url" content="https://antonybush.github.io/pages/blog.html">
    <meta property="og:site_name" content="Antony Bush - Backend Software Engineer">
    <meta property="article:author" content="Antony Bush">

    <!-- Twitter Card (generic fallback — JS updates dynamically) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Blog | Antony Bush">
    <meta name="twitter:description"
        content="Technical blog posts covering systems programming, networking, backend architecture, and productivity tools.">

    <!-- Canonical URL (JS updates dynamically based on blog ID) -->
    <link rel="canonical" href="https://antonybush.github.io/pages/blog.html">

    <!-- Fonts & Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">

    <!-- Structured Data / Schema.org (generic fallback — JS updates dynamically) -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Blog",
        "name": "Antony Bush's Technical Blog",
        "description": "Technical blog posts covering systems programming, networking, backend architecture, and productivity tools.",
        "author": {
            "@type": "Person",
            "name": "Antony Bush",
            "url": "https://antonybush.github.io"
        },
        "publisher": {
            "@type": "Person",
            "name": "Antony Bush"
        },
        "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": "https://antonybush.github.io/pages/blog.html"
        }
    }
    </script>
</head>

<body class="blog-page">
    <!-- Animated Background (shared) -->
    <div class="bg-animation">
        <div class="stars"></div>
        <div class="stars2"></div>
        <div class="stars3"></div>
    </div>

    <!-- Navigation (loaded dynamically) -->
    <div id="nav-placeholder"></div>

    <!-- Blog Content -->
    <main class="blog-main" id="blog-main">
        <div class="blog-container">
            <!-- Loading State -->
            <div class="blog-loading" id="blog-loading">
                <div class="loading-spinner"></div>
                <p>Loading blog...</p>
            </div>

            <!-- Blog Header -->
            <header class="blog-header" id="blog-header" style="display: none;">
                <a href="../index.html#blogs" class="back-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7" />
                    </svg>
                    Back to Blogs
                </a>
                <div class="blog-meta">
                    <span class="blog-date" id="blog-date"></span>
                    <span class="blog-read-time" id="blog-read-time"></span>
                </div>
                <h1 class="blog-title" id="blog-title"></h1>
                <p class="blog-subtitle" id="blog-subtitle"></p>
                <div class="blog-tags" id="blog-tags"></div>
            </header>

            <!-- Diagrams Section -->
            <div class="blog-diagrams" id="blog-diagrams" style="display: none;"></div>

            <!-- Main Content -->
            <article class="blog-content" id="blog-content" style="display: none;"></article>
        </div>
    </main>

    <!-- Footer (loaded dynamically) -->
    <div id="footer-placeholder"></div>

    <script src="../blog.js"></script>
</body>

</html>
